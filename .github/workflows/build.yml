name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: ./gradlew build

      # Game tests need a real server, so they are a separate task from the JUnit suite that
      # `build` runs. The attribution tests in particular can only be checked here — the question
      # is what a third-party protection mod observes on the event bus.
      - name: Run game tests
        run: ./gradlew runGameTestServer