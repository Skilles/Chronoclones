name: Build

on:
  push:
    paths:
      - "src/**"
      - "versions/**"
      - "gradle/**"
      - ".github/scripts/**"
      - "gradlew"
      - "gradlew.bat"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".sc_active_version"
      - ".github/workflows/build.yml"

  pull_request:
    paths:
      - "src/**"
      - "versions/**"
      - "gradle/**"
      - ".github/scripts/**"
      - "gradlew"
      - "gradlew.bat"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".sc_active_version"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - node: 26.2-neoforge
            gametest_task: runGameTestServer
          - node: 26.2-fabric
            gametest_task: runGametest
          - node: 1.21.1-neoforge
            gametest_task: runGameTestServer
          - node: 1.21.1-fabric
            gametest_task: runGametest
          - node: 1.20.1-fabric
            gametest_task: runGametest
          - node: 1.20.1-forge
            gametest_task: runGameTestServer

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build
        run: ./gradlew ":${{ matrix.node }}:build"

      - name: Verify shipped JAR
        run: bash .github/scripts/verify_shipped_jar.sh "${{ matrix.node }}"

      - name: Unit tests
        run: ./gradlew ":${{ matrix.node }}:test"

      - name: Game tests
        run: ./gradlew ":${{ matrix.node }}:${{ matrix.gametest_task }}"

      - name: Upload mod JAR
        uses: actions/upload-artifact@v7
        with:
          name: chronoclones-${{ matrix.node }}
          path: |
            versions/${{ matrix.node }}/build/libs/*.jar
            !versions/${{ matrix.node }}/build/libs/*-sources.jar
            !versions/${{ matrix.node }}/build/libs/*-javadoc.jar
            !versions/${{ matrix.node }}/build/libs/*-dev.jar
            !versions/${{ matrix.node }}/build/libs/*-downgraded.jar
          if-no-files-found: error
