# Kept in sync with the aw/ twin of this file. 1.21.1 variant: AbstractHorse moved packages.

# A fake player never ticks, so its attack cooldown never refills and every swing would land
# permanently uncharged.
public net.minecraft.world.entity.LivingEntity attackStrengthTicker

# The use countdown runs in the private updatingUsingItem, so a clone has to run it by hand; a bow
# reads its draw off what is left.
public net.minecraft.world.entity.LivingEntity useItemRemaining
public net.minecraft.world.entity.LivingEntity completeUsingItem()V
# An override may not be less visible than what it overrides.
public net.minecraft.server.level.ServerPlayer completeUsingItem()V

# Where a container screen draws its slots; the mod reads the fields directly so the same code
# compiles against Fabric, which lacks NeoForge's getters.
public net.minecraft.client.gui.screens.inventory.AbstractContainerScreen leftPos
public net.minecraft.client.gui.screens.inventory.AbstractContainerScreen topPos

# The horse screen replay builds the menu directly; vanilla exposes no getter for this.
public net.minecraft.world.entity.animal.horse.AbstractHorse inventory
