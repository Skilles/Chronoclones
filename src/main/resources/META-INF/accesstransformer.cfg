# A clone's swing goes through Player.attack, which scales damage, crits and sweeping by
# getAttackStrengthScale() -- and that reads attackStrengthTicker, which only advances while a
# player ticks. A fake player never ticks, so without reaching this field every clone would swing
# permanently uncharged, for the 0.2x minimum, with no enchantment bonus and no sweep.
public net.minecraft.world.entity.LivingEntity attackStrengthTicker

# An item held down counts its own duration away while the player using it ticks, in the private
# updatingUsingItem. A clone's player never ticks, so the countdown has to be run by hand: without
# it a drawn bow stays at full remaining ticks forever, and since a bow's power is read off exactly
# that number, every arrow would loose at no charge at all.
public net.minecraft.world.entity.LivingEntity useItemRemaining
public net.minecraft.world.entity.LivingEntity completeUsingItem()V
# ServerPlayer overrides it, and an override may not be less visible than what it overrides.
public net.minecraft.server.level.ServerPlayer completeUsingItem()V
